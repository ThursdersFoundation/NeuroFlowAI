[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# =========================
# PROJECT METADATA
# =========================
[project]
name = "neuroflowai"
version = "0.1.0"
description = "Advanced lightweight AI pipeline framework for scalable machine learning systems"
readme = "README.md"
requires-python = ">=3.8,<3.15"

authors = [
    { name = "Rauf Fauzan Rambe", email = "your@email.com" }
]

license = { text = "MIT" }

keywords = [
    "ai",
    "machine-learning",
    "pipeline",
    "data-science",
    "ml-framework",
    "automation"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License"
]

dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "joblib>=1.2"
]

# =========================
# OPTIONAL DEPENDENCIES
# =========================
[project.optional-dependencies]

dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
    "mypy"
]

api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27"
]

full = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
    "mypy",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27"
]

# =========================
# ENTRY POINT (CLI FUTURE)
# =========================
[project.scripts]
neuroflow = "neuroflowai.cli:main"

# =========================
# URLS
# =========================
[project.urls]
Homepage = "https://github.com/yourusername/neuroflowai"
Documentation = "https://github.com/yourusername/neuroflowai#readme"
Repository = "https://github.com/yourusername/neuroflowai"
Issues = "https://github.com/yourusername/neuroflowai/issues"

# =========================
# PACKAGE CONFIG
# =========================
[tool.setuptools.packages.find]
where = ["."]
include = ["neuroflowai*"]

# =========================
# PYTEST
# =========================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --disable-warnings"

# =========================
# BLACK
# =========================
[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py312", "py313"]

# =========================
# ISORT
# =========================
[tool.isort]
profile = "black"
line_length = 88

# =========================
# FLAKE8
# =========================
[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

# =========================
# MYPY (TYPE CHECKING)
# =========================
[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
strict = false
